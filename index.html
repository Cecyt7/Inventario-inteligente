<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUINDA - Inventario Inteligente</title>
  <style>
    /* VARIABLES DE DISEÑO (Iguales a tu Chat para que combinen) */
    :root {
      --guinda: #640328;
      --guinda-deep: #2c0112;
      --oro: #FFD700;
      --blanco-glass: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }

    body {
      background: linear-gradient(135deg, var(--guinda) 0%, var(--guinda-deep) 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* BARRA SUPERIOR PREMIUM */
    .barra-superior {
      position: fixed;
      top: 0;
      width: 100%;
      height: 90px;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 5px solid var(--oro);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .logo-izq { height: 75px; transition: transform 0.3s; }
    .logo-der { height: 70px; transition: transform 0.3s; }
    .logo-izq:hover, .logo-der:hover { transform: scale(1.05); }

    /* CONTENIDO CON EFECTO GLASS */
    .contenido {
      text-align: center;
      margin-top: 120px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      animation: fadeIn 1s ease-out;
    }

    .glass-card {
      background: var(--blanco-glass);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 50px;
      border-radius: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      max-width: 800px;
    }

    .contenido h1 { 
      font-size: clamp(24px, 5vw, 42px); 
      margin-bottom: 15px; 
      letter-spacing: 1px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    }

    .contenido h2 { 
      font-size: clamp(18px, 3vw, 24px); 
      font-weight: 300; 
      margin-bottom: 10px; 
      opacity: 0.9;
    }

    .contenido h3 { 
      font-size: clamp(16px, 2.5vw, 20px); 
      font-weight: bold; 
      margin-bottom: 40px; 
      color: var(--oro);
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    /* BOTÓN NAVEGAR ESTILO PRO */
    .btn-navegar {
      background: white;
      color: var(--guinda);
      border: none;
      padding: 18px 50px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .btn-navegar:hover {
      background: var(--oro);
      color: black;
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 15px 30px rgba(255, 215, 0, 0.4);
    }

    .btn-navegar:active {
      transform: scale(0.95);
    }

    /* FOOTER MEMORIAL */
    footer {
      padding: 30px 20px;
      background: rgba(0,0,0,0.2);
      margin-top: 40px;
    }

    .footer-linea {
      width: 150px;
      height: 3px;
      background: var(--oro);
      margin: 0 auto 20px;
      border-radius: 5px;
      opacity: 0.8;
    }

    .memorial-box {
      max-width: 700px;
      margin: 0 auto;
      font-style: italic;
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 0.5px;
    }

    .nombres-resaltados {
      color: white;
      font-weight: bold;
      display: block;
      margin-top: 5px;
      font-size: 16px;
      font-style: normal;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsivo */
    @media (max-width: 600px){
      .barra-superior { height: 70px; padding: 0 15px; }
      .logo-izq, .logo-der { height: 50px; }
      .glass-card { padding: 30px 20px; border-radius: 20px; }
      .contenido { margin-top: 100px; }
    }
  </style>
</head>
<body>

  <div class="barra-superior">
    <img src="./img/logo_ipn.png" alt="IPN" class="logo-izq">
    <div style="color:var(--guinda); font-weight:800; font-size:1.1em; text-align:center;" class="nom-escuela">CECyT 7</div>
    <img src="./img/logo_cecyt7.png" alt="CECyT 7" class="logo-der">
  </div>

  <div class="contenido">
    <div class="glass-card">
      <h1>Instituto Politécnico Nacional</h1>
      <h2>Centro de Estudios Científicos y Tecnológicos<br>Número 7 "Cuauhtémoc"</h2>
      <h3>Gestión de Taller Industrial</h3>
      <button class="btn-navegar" onclick="window.location.href='./paginas/carreras.html'">Ingresar al Sistema</button>
    </div>
  </div>

  <footer>
    <div class="footer-linea"></div>
    <div class="memorial-box">
      "En memoria de <span class="nombres-resaltados">José Gabriel Hernández Méndez y Alí Yael Gonzales Aranda</span>
      Siempre vivos en nuestros corazones. Con amor, sus amigos."
    </div>
  </footer>

</body>
</html>
