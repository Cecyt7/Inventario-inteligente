  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background-color: #640328;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Barra superior */
    .barra-superior {
      position: fixed;
      top: 0;
      width: 100%;
      height: 80px;
      background-color: white;
      border-bottom: 4px solid #FFD700; /* Oro */
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 30px;
      z-index: 1000;
    }

    .logo { height: 60px; }

    /* Contenedor */
    .contenedor {
      margin-top: 100px;
      flex: 1;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      width: 95%;
      padding-bottom: 40px;
    }

    .btn-volver {
      padding: 10px 20px;
      background-color: white;
      color: #640328;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 { text-align: center; margin-bottom: 20px; font-size: 28px; }

    /* Chat Estilo */
    .chat-container {
      background-color: #f9f9f9;
      border-radius: 15px;
      height: 400px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      overflow: hidden;
      margin-bottom: 15px;
    }

    #chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-user {
      align-self: flex-end;
      background-color: #640328;
      color: white;
      padding: 8px 15px;
      border-radius: 15px 15px 0 15px;
      max-width: 80%;
      font-size: 14px;
    }

    .msg-bot {
      align-self: flex-start;
      background-color: #e0e0e0;
      color: #333;
      padding: 8px 15px;
      border-radius: 15px 15px 15px 0;

      font-size: 14px;
      border-left: 4px solid #FFD700;
    }

    /* Entrada de datos */
    .input-group {
      display: flex;
      gap: 8px;
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    #pregunta {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 5px;
      outline: none;
      color: black;
    }

    .botones button {
      padding: 10px 15px;
      background-color: #640328;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .cargando { text-align: center; color: #FFD700; display: none; margin-top: 10px; }

    @media (max-width: 600px) {
      .barra-superior { padding: 0 10px; }
      .logo { height: 40px; }
    }

    const MAQUINAS_GID = { 'torno': 0, 'fresadora': 406685106, 'mesa': 675907642, 'esmeril': 1328099769, 'soldadora': 1403892581, 'taladradora': 583489325, 'cepillo': 639087492, 'comparador': 737994113, 'cnc': 123325945 };

    let CACHE = {};

    function detectarMaquina(pregunta) {
      const q = pregunta.toLowerCase();
      const dicc = {
        'torno': [/torn/], 'fresadora': [/fresa/], 'mesa': [/mesa/], 'esmeril': [/esmeril/],
        'soldadora': [/solda/], 'taladradora': [/taladra/], 'cepillo': [/cepillo/],
        'comparador': [/compa/], 'cnc': [/cnc/, /compu/]
      };
      for (const [key, regexs] of Object.entries(dicc)) {
        if (regexs.some(rx => rx.test(q))) return { nombre: key.toUpperCase(), key: key };
      }
      return null;
    }

    function detectarID(pregunta) {
      const m = pregunta.match(/\b(\d+)\b/);
      return m ? m[1] : null;
    }

    function parseCSV(text) {
      const rows = []; let row = []; let cur = ''; let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') { inQuotes = !inQuotes; continue; }
        if (c === ',' && !inQuotes) { row.push(cur); cur = ''; continue; }
        if ((c === '\n' || c === '\r') && !inQuotes) {
          row.push(cur); cur = ''; if (row.length > 1 || row[0] !== '') rows.push(row);
          row = []; continue;
        }
        cur += c;
      }
      row.push(cur); if (row.length > 1 || row[0] !== '') rows.push(row);
      return rows;
    }

    async function cargarDatosSheet(gid) {
      const url = `${SHEET_BASE}?gid=${gid}&single=true&output=csv`;
      const res = await fetch(url, { cache: "no-store" });
      const csv = await res.text();
      const rows = parseCSV(csv);
      const headers = rows[0].map(h => String(h || '').trim());
      return rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, i) => obj[h] = String(r[i] ?? '').trim());
        return obj;
      });
    }

       function mostrarRespuestas(datos, maqNombre, queryUsuario) {

  let respuestaIA = "";
  
  if (!datos || datos.resultados.length === 0) {
    respuestaIA = `No se encontró registro para el equipo **${maqNombre}**. Por favor, verifique el número de identificación o el nombre de la categoría.`;
  } else {

    // Lógica de respuesta profesional
    if (estado.includes("BUEN") || estado.includes("OPERATIVO") || estado.includes("EXCELENTE")) {
      respuestaIA = `**REPORTE DE ESTADO:** El equipo **${nombre} (ID: ${id})** se encuentra **OPERATIVO**. Está disponible para su uso bajo las normas de seguridad vigentes en el taller.`;
    } else if (estado.includes("MANTENIMIENTO") || estado.includes("REVISIÓN") || estado.includes("CALIBRACIÓN")) {

    function toggleVoz() {
      VOZ_ACTIVA = !VOZ_ACTIVA;
      document.getElementById("btnVoz").textContent = VOZ_ACTIVA ? "🔊 ON" : "🔊 OFF";
    }

    function hablar(texto) {
      if (!VOZ_ACTIVA || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = "es-MX";
      window.speechSynthesis.speak(u);
    }

    function dictarPregunta() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert('Navegador no soportado');
      const rec = new SpeechRecognition();
      rec.lang = 'es-MX';
      rec.onresult = (e) => {
        document.getElementById('pregunta').value = e.results[0][0].transcript;
        hacerPregunta();
      };
      rec.start();
    }
