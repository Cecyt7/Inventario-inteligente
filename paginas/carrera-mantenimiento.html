<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento Industrial - Inventario</title>
  <link rel="stylesheet" href="../css/carrera-mantenimiento.css">
</head>
<body>
  <div class="barra-superior">
    <img src="../img/logo_ipn.png" class="logo" alt="IPN">
    <img src="../img/logo_cecyt7.png" class="logo" alt="CECyT 7">
  </div>

  <div class="contenedor">
   <button class="btn-volver" onclick="window.location.href='carreras.html'">← Volver a Carreras</button>
    <h1>🔧 Mantenimiento Industrial</h1>

    <div class="consulta">
      <p>Consulta información sobre la maquinaria del taller:</p>

      <div class="input-group">
        <input
          type="text"
          id="pregunta"
          placeholder="Ejemplo: Torno 18"
          onkeypress="if(event.key === 'Enter') hacerPregunta()"
        >

        <div class="botones">
          <button type="button" onclick="hacerPregunta()">🔍 Buscar</button>
          <button type="button" class="btn-voz" onclick="dictarPregunta()" title="Hablar (dictado)">🎤</button>
          <button type="button" class="btn-voz" onclick="toggleVoz()" id="btnVoz" title="Activar/Desactivar voz">🔊 OFF</button>
        </div>
      </div>

      <div class="cargando" id="cargando">
        <div class="spinner"></div>
        <p>Buscando en la base de datos...</p>
      </div>

      <div class="respuesta" id="respuesta" style="display:none;"></div>
      <div class="resultados" id="resultados"></div>
    </div>
    <button class="btn-volver" type="button" onclick="terminarSesion()">🛑 Terminar</button>
  </div>

  <script>
    // Guard: verifica pase de lista
    (function () {
      const hoy = new Date().toISOString().slice(0, 10);
      const pase = localStorage.getItem("pase_ok_fecha");
      if (pase !== hoy) window.location.replace("./pase-lista.html");
    })();

    const SHEET_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRUrhKITYUYWL4moZTLQuM2ggb906ulR0-jQwOn-m_UpO1T_6VP6a9o3FhL1YO9eYNvlZtJvdJLMgad/pub';
    
    const MAQUINAS_GID = {
      'torno': 0,
      'fresadora': 1,
      'mesa': 2,
      'esmeril': 3,
      'soldadora': 4,
      'taladradora': 5,
      'cepillo': 6,
      'compresor': 7,
      'cnc': 8
    };

    function detectarMaquina(pregunta) {
      const q = pregunta.toLowerCase();
      if (q.includes('torno')) return { nombre: 'TORNO', key: 'torno' };
      if (q.includes('fresadora')) return { nombre: 'FRESADORA', key: 'fresadora' };
      if (q.includes('mesa')) return { nombre: 'MESA DE ELECTRONICA', key: 'mesa' };
      if (q.includes('esmeril')) return { nombre: 'ESMERIL', key: 'esmeril' };
      if (q.includes('solda')) return { nombre: 'SOLDADORA', key: 'soldadora' };
      if (q.includes('taladra')) return { nombre: 'TALADRADORA', key: 'taladradora' };
      if (q.includes('cepillo')) return { nombre: 'CEPILLO', key: 'cepillo' };
      if (q.includes('compresor')) return { nombre: 'COMPRESOR', key: 'compresor' };
      if (q.includes('cnc') || q.includes('computadora')) return { nombre: 'COMPUTADORAS CNC', key: 'cnc' };
      return null;
    }

    function detectarID(pregunta) {
      const m = pregunta.match(/\b(\d+)\b/);
      return m ? m[1] : null;
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];
        if (c === '"' && inQuotes && next === '"') { cur += '"'; i++; continue; }
        if (c === '"') { inQuotes = !inQuotes; continue; }
        if (c === ',' && !inQuotes) { row.push(cur); cur = ''; continue; }
        if ((c === '\n' || c === '\r') && !inQuotes) {
          if (c === '\r' && next === '\n') i++;
          row.push(cur); cur = '';
          if (row.length > 1 || row[0] !== '') rows.push(row);
          row = [];
          continue;
        }
        cur += c;
      }
      row.push(cur);
      if (row.length > 1 || row[0] !== '') rows.push(row);
      return rows;
    }

    async function cargarDatosSheet(gid) {
      const url = `${SHEET_BASE}?gid=${gid}&single=true&output=csv`;
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("No pude cargar el CSV (HTTP " + res.status + ")");
      const csv = await res.text();
      const rows = parseCSV(csv);
      if (!rows.length) throw new Error("CSV vacío");
      const headers = rows[0].map(h => String(h || '').trim());
      const data = rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, i) => obj[h] = String(r[i] ?? '').trim());
        return obj;
      });
      return data;
    }

    function mostrarRespuestas(datos) {
      const respuestasDiv = document.getElementById('respuesta');
      const resultadosDiv = document.getElementById('resultados');
      if (!datos || !Array.isArray(datos.resultados) || datos.cantidad === 0) {
        respuestasDiv.className = 'respuesta error';
        respuestasDiv.textContent = '❌ No se encontraron resultados.';
        respuestasDiv.style.display = 'block';
        resultadosDiv.innerHTML = '';
        hablar('No se encontraron resultados.');
        return;
      }
      respuestasDiv.className = 'respuesta exito';
      respuestasDiv.textContent = `✅ Se encontraron ${datos.cantidad} resultado(s)`;
      respuestasDiv.style.display = 'block';
      hablar(`Se encontraron ${datos.cantidad} resultado(s).`);
      resultadosDiv.innerHTML = datos.resultados.map((r, i) => `
        <div class="resultado-item">
          <strong>${i + 1}. Coincidencia:</strong> ${r.coincidencia}<br>
          <strong>Valor:</strong> ${r.valor}<br><br>
          <div class="resultado-pre"><strong>Registro:</strong>\n${Object.entries(r.item || {}).map(([k,v]) => `${k}: ${v}`).join('\n')}</div>
        </div>
      `).join('');
    }

    function mostrarError(mensaje) {
      const respuestasDiv = document.getElementById('respuesta');
      respuestasDiv.className = 'respuesta error';
      respuestasDiv.textContent = `⚠️ ${mensaje}`;
      respuestasDiv.style.display = 'block';
      document.getElementById('resultados').innerHTML = '';
    }

    function ocultarRespuesta() {
      document.getElementById('respuesta').style.display = 'none';
      document.getElementById('resultados').innerHTML = '';
    }

    function mostrarCargando(visible) {
      document.getElementById('cargando').style.display = visible ? 'block' : 'none';
    }

    let CACHE = {};

    async function hacerPregunta() {
      const pregunta = document.getElementById('pregunta').value.trim();
      if (!pregunta) return mostrarError('Escribe una pregunta');
      mostrarCargando(true);
      ocultarRespuesta();
      try {
        const maq = detectarMaquina(pregunta);
        if (!maq) throw new Error('No detecté la máquina. Di: torno, fresadora, mesa, esmeril, soldadora, taladradora, cepillo, compresor o CNC.');
        const gid = MAQUINAS_GID[maq.key];
        if (!CACHE[maq.key]) CACHE[maq.key] = await cargarDatosSheet(gid);
        const data = CACHE[maq.key];
        const id = detectarID(pregunta);
        if (id) {
          const row = data.find(x => String(x["IDENTIFICACION"] || "").trim() === String(id).trim());
          if (!row) throw new Error(`No encontré ${maq.nombre} con ID ${id}`);
          return mostrarRespuestas({ cantidad: 1, resultados: [{ coincidencia: `${maq.nombre} ID`, valor: id, item: row }] });
        }
        const q = pregunta.toLowerCase();
        const results = [];
        for (const item of data) {
          for (const [k, v] of Object.entries(item)) {
            if (String(v).toLowerCase().includes(q)) {
              results.push({ coincidencia: k, valor: v, item });
              break;
            }
          }
        }
        mostrarRespuestas({ cantidad: results.length, resultados: results });
      } catch (e) {
        mostrarError(`Error: ${e.message}`);
      } finally {
        mostrarCargando(false);
      }
    }

    let VOZ_ACTIVA = false;

    function toggleVoz() {
      VOZ_ACTIVA = !VOZ_ACTIVA;
      const btn = document.getElementById("btnVoz");
      if (btn) btn.textContent = VOZ_ACTIVA ? "🔊 ON" : "🔊 OFF";
      const msg = VOZ_ACTIVA ? "Voz activada." : "Voz desactivada.";
      if (VOZ_ACTIVA) hablar(msg);
      else console.log(msg);
    }

    function hablar(texto) {
      if (!VOZ_ACTIVA) return;
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(texto));
      u.lang = "es-MX";
      u.rate = 1;
      u.pitch = 1;
      window.speechSynthesis.speak(u);
    }

    function dictarPregunta() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        mostrarError('Tu navegador no soporta dictado. Usa Chrome.');
        hablar('Tu navegador no soporta dictado por voz.');
        return;
      }
      const rec = new SpeechRecognition();
      rec.lang = 'es-MX';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      mostrarCargando(true);
      rec.onresult = (event) => {
        const texto = event.results[0][0].transcript;
        document.getElementById('pregunta').value = texto;
        mostrarCargando(false);
        hacerPregunta();
      };
      rec.onerror = (event) => {
        mostrarCargando(false);
        mostrarError('Voz: ' + event.error);
        hablar('Error con el micrófono.');
      };
      rec.onend = () => mostrarCargando(false);
      rec.start();
    }

    function terminarSesion(){
      localStorage.removeItem("pase_ok_fecha");
      localStorage.removeItem("pase_ok_boleta");
      window.location.replace("./pase-lista.html");
    }
  </script>
</body>
</html>
