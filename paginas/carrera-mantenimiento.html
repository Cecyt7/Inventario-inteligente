<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUINDA - Gestión de Taller CECyT 7</title>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #640328; /* Guinda IPN */
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Barra superior */
    .barra-superior {
      position: fixed;
      top: 0; width: 100%; height: 80px;
      background-color: white;
      border-bottom: 4px solid #FFD700; /* Oro */
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 30px; z-index: 900;
    }

    .logo { height: 50px; }

    /* Contenedor Principal */
    .contenedor {
      margin-top: 100px;
      flex: 1;
      max-width: 800px;
      margin-left: auto; margin-right: auto;
      width: 95%;
      padding-bottom: 40px;
    }

    .btn-volver {
      padding: 8px 15px; background-color: white; color: #640328;
      border: none; border-radius: 5px; cursor: pointer;
      font-weight: bold; margin-bottom: 15px;
    }

    h1 { text-align: center; margin-bottom: 20px; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }

    /* Chat Estilo */
    .chat-container {
      background-color: #ececec;
      border-radius: 10px;
      height: 450px;
      display: flex; flex-direction: column;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      overflow: hidden; margin-bottom: 15px;
    }

    #chat-messages {
      flex: 1; padding: 20px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
    }

    .msg-user {
      align-self: flex-end; background-color: #4a4a4a; color: white;
      padding: 10px 15px; border-radius: 10px 10px 0 10px;
      max-width: 80%; font-size: 14px; font-weight: bold;
      border-right: 4px solid #640328;
    }

    .msg-bot {
      align-self: flex-start; background-color: white; color: #2c3e50;
      padding: 12px 18px; border-radius: 10px 10px 10px 0;
      max-width: 85%; font-size: 14px; line-height: 1.5;
      border-left: 4px solid #FFD700; box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    }

    /* FICHA TÉCNICA PRO */
    .ficha-tecnica {
      background: #2c3e50;
      color: white;
      border-radius: 8px;
      padding: 15px;
      margin-top: 5px;
      border-left: 5px solid #640328; /* Guinda */
      font-family: 'Segoe UI', Tahoma, sans-serif;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      width: 100%;
    }

    .ficha-header {
      border-bottom: 1px solid #7f8c8d;
      margin-bottom: 10px;
      padding-bottom: 5px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1em;
      color: #FFD700; /* Oro */
      text-transform: uppercase;
    }

    .ficha-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 0.85em;
    }

    .dato-label { color: #bdc3c7; font-size: 0.75em; text-transform: uppercase; display: block; margin-bottom: 2px; }
    .dato-valor { color: #ecf0f1; font-weight: bold; }

    /* Entrada de datos */
    .input-group {
      display: flex; gap: 8px; background: white;
      padding: 12px; border-radius: 10px;
    }

    #pregunta {
      flex: 1; padding: 12px; border: 2px solid #ddd;
      border-radius: 5px; outline: none; color: black; font-size: 16px;
    }

    .botones button {
      padding: 10px 15px; background-color: #640328; color: white;
      border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
    }

    /* MODAL DE REGISTRO GUINDA */
    .jarvis-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none;
      justify-content: center; align-items: center; z-index: 2000;
    }

    .modal-content {
      background: #f4f4f4; padding: 30px; border-radius: 8px;
      border-left: 10px solid #640328; width: 350px; text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6); color: #333;
    }

    .modal-content h3 { color: #640328; margin-bottom: 15px; }
    .modal-content input {
      width: 100%; padding: 12px; margin: 8px 0;
      border: 1px solid #ccc; border-radius: 4px;
    }

    .btn-confirmar {
      background: #640328; color: white; border: none;
      padding: 12px 25px; cursor: pointer; font-weight: bold;
      width: 100%; margin-top: 15px; border-radius: 4px;
    }

    .cargando { text-align: center; color: #FFD700; display: none; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Modal de Registro -->
  <div id="modal-registro" class="jarvis-modal" style="display: none;">
    <div class="modal-content">
      <h3>📋 REGISTRO DE USO</h3>
      <p id="info-maquina-registro" style="font-weight:bold; margin-bottom:10px;"></p>
      <input type="text" id="nombre-alumno" placeholder="Nombre completo">
      <input type="text" id="boleta-alumno" placeholder="Número de Boleta">
      <input type="text" id="grupo-alumno" placeholder="Grupo (Ej: 4IM1)">
      <button class="btn-confirmar" onclick="confirmarRegistro()">AUTORIZAR INICIO</button>
      <button onclick="cerrarModal()" style="margin-top:15px; background:none; border:none; color:gray; cursor:pointer;">Cancelar</button>
    </div>
  </div>

  <div class="barra-superior">
    <img src="../img/logo_ipn.png" class="logo" alt="IPN">
    <img src="../img/logo_cecyt7.png" class="logo" alt="CECyT 7">
  </div>

  <div class="contenedor">
    <button class="btn-volver" onclick="window.location.href='./carreras.html'">← Panel Principal</button>
    
    <h1>SISTEMA GUINDA: Gestión Técnica</h1>

    <div class="chat-container">
      <div id="chat-messages">
        <div class="msg-bot">Sistema GUINDA en línea. Ingrese el equipo para consulta o indique si desea registrar una operación.</div>
      </div>
    </div>

    <div class="input-group">
      <input type="text" id="pregunta" placeholder="Ej: Usar Torno 5 o Consultar Torno 2" onkeypress="if(event.key === 'Enter') hacerPregunta()">
      <div class="botones">
        <button onclick="hacerPregunta()">Enviar</button>
        <button id="btnVoz" onclick="toggleVoz()">🔊 OFF</button>
        <button onclick="dictarPregunta()">🎤</button>
      </div>
    </div>

    <div id="cargando" class="cargando">PROCESANDO SOLICITUD...</div>
  </div>

<script>
    // --- CONFIGURACIÓN ---
    const SHEET_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRUrhKITYUYWL4moZTLQuM2ggb906ulR0-jQwOn-m_UpO1T_6VP6a9o3FhL1YO9eYNvlZtJvdJLMgad/pub';
    const URL_GUINDA_GATEWAY = "https://script.google.com/macros/s/AKfycbzrMi2HyJEXezEUCrq3Roe3r9h5R5yagUtOcF3BhX9_S6kje-tj5H30GbsKNUnThpaH/exec"; 
    
    const MAQUINAS_GID = { 
      'torno': 0, 
      'fresadora': 406685106, 
      'mesa': 675907642, 
      'esmeril': 1328099769, 
      'soldadora': 1403892581, 
      'taladradora': 583489325, 
      'cepillo': 639087492, 
      'comparador': 737994113, 
      'cnc': 123325945 
    };

    let CACHE = {};
    let VOZ_ACTIVA = false;
    let estadoSesion = { maquinaPendiente: null, idPendiente: null };

    // --- LÓGICA DE DETECCIÓN ---
    function detectarMaquina(pregunta) {
      const q = pregunta.toLowerCase();
      const dicc = {
        'torno': [/torn/], 'fresadora': [/fresa/], 'mesa': [/mesa/], 'esmeril': [/esmeril/],
        'soldadora': [/solda/], 'taladradora': [/taladra/], 'cepillo': [/cepillo/],
        'comparador': [/compa/], 'cnc': [/cnc/, /compu/]
      };
      for (const [key, regexs] of Object.entries(dicc)) {
        if (regexs.some(rx => rx.test(q))) return { nombre: key.toUpperCase(), key: key };
      }
      return null;
    }

    function detectarID(pregunta) {
      const m = pregunta.match(/\b(\d+)\b/);
      return m ? m[1] : null;
    }

    // --- NUEVA FUNCIÓN DE RESUMEN GENERAL ---
    async function generarResumenGeneral() {
        imprimirBot("Iniciando escaneo de todas las unidades... Por favor, espera.");
        document.getElementById('cargando').style.display = 'block';

        let reporteFinal = "📋 **RESUMEN DE ESTADO GENERAL**\n\n";
        
        try {
            for (const [nombre, gid] of Object.entries(MAQUINAS_GID)) {
                if (!CACHE[nombre]) {
                    CACHE[nombre] = await cargarDatosSheet(gid);
                }
                const data = CACHE[nombre];
                const total = data.length;
                
                const operativos = data.filter(item => {
                    const estado = (item["ESTADO"] || "").toUpperCase();
                    return estado.includes("BUEN") || estado.includes("OPERATIVO") || estado.includes("EXCELENTE");
                }).length;
                
                const mantenimiento = data.filter(item => {
                    const estado = (item["ESTADO"] || "").toUpperCase();
                    return estado.includes("MANTENIMIENTO") || estado.includes("REVISIÓN") || estado.includes("FALLA");
                }).length;

                reporteFinal += `🔹 **${nombre.toUpperCase()}:** ${total} unidades (${operativos} ✅ / ${mantenimiento} 🛠️)\n`;
            }
            reporteFinal += "\n*Reporte generado exitosamente.*";
            imprimirBot(reporteFinal);
        } catch (error) {
            imprimirBot("❌ Error: No pude conectar con todas las hojas del inventario.");
            console.error(error);
        } finally {
            document.getElementById('cargando').style.display = 'none';
        }
    }

    // --- MANEJO DE DATOS ---
    async function hacerPregunta() {
      const input = document.getElementById('pregunta');
      const pregunta = input.value.trim();
      if (!pregunta) return;

      // 1. Mostrar mensaje del usuario de forma única
      const chat = document.getElementById('chat-messages');
      chat.innerHTML += `<div class="msg-user">${pregunta}</div>`;
      input.value = "";
      chat.scrollTop = chat.scrollHeight;

      // 2. DETECTOR DE RESUMEN
      if (pregunta.toLowerCase().match(/(resumen|estado general|reporte de todo)/)) {
          await generarResumenGeneral();
          return; 
      } 

      // 3. Detectar si es Registro o Consulta
      const maq = detectarMaquina(pregunta);
      const id = detectarID(pregunta);

      if (!maq) {
        imprimirBot("No reconozco el equipo solicitado. Por favor, especifique (Torno, Fresa, etc.)");
        return;
      }

      // PROTOCOLO DE REGISTRO
      if (pregunta.toLowerCase().match(/(usar|registrar|ocupar|voy a)/)) {
        abrirModalRegistro(maq.nombre, id || "S/N");
        return;
      }

      // PROTOCOLO DE CONSULTA
      document.getElementById('cargando').style.display = 'block';
      try {
        if (!CACHE[maq.key]) {
          CACHE[maq.key] = await cargarDatosSheet(MAQUINAS_GID[maq.key]);
        }
        
        const data = CACHE[maq.key];
        const resultado = id ? data.find(x => String(x["IDENTIFICACION"]).trim() === String(id)) : null;
        
        const tempId = "temp-" + Date.now();
        chat.innerHTML += `<div class="msg-bot" id="${tempId}">Analizando base de datos...</div>`;
        chat.scrollTop = chat.scrollHeight;

        setTimeout(() => {
          const tempElem = document.getElementById(tempId);
          if(tempElem) tempElem.remove();
          procesarRespuestaTecnica(resultado, maq.nombre, id);
        }, 600);

      } catch (e) {
        imprimirBot("Error al conectar con el inventario.");
      } finally {
        document.getElementById('cargando').style.display = 'none';
      }
    }

function procesarRespuestaTecnica(item, maqNombre, id) {
      if (!item) {
        imprimirBot(`No se encontró registro para **${maqNombre} ${id || ''}**. Verifique el número de unidad.`);
        return;
      }

      const estado = (item["ESTADO"] || "SIN REPORTE").toUpperCase();
      const ubicacion = item["UBICACION"] || "Zona de Talleres";
      const marca = item["MARCA"] || item["MODELO"] || "Genérico";
      const especificaciones = item["ESPECIFICACIONES"] || item["NOTAS"] || "Sin datos técnicos adicionales.";

      // 1. Definimos el diseño de la FICHA PRO
      const fichaHTML = `
        <div class="ficha-tecnica">
          <div class="ficha-header">🛠️ FICHA TÉCNICA: ${maqNombre} ${id}</div>
          <div class="ficha-grid">
            <div>
              <span class="dato-label">Estado actual:</span><br>
              <span class="dato-valor" style="color: ${estado.includes('OPERATIVO') ? '#2ecc71' : '#e74c3c'}">${estado}</span>
            </div>
            <div>
              <span class="dato-label">Ubicación:</span><br>
              <span class="dato-valor">${ubicacion}</span>
            </div>
            <div>
              <span class="dato-label">Marca/Modelo:</span><br>
              <span class="dato-valor">${marca}</span>
            </div>
            <div>
              <span class="dato-label">ID de Unidad:</span><br>
              <span class="dato-valor">${id}</span>
            </div>
          </div>
          <div style="margin-top: 12px; padding-top: 8px; border-top: 1px dashed #7f8c8d; font-size: 0.85em;">
            <span class="dato-label">Especificaciones Técnicas:</span><br>
            <span style="color: #f1c40f;">${especificaciones}</span>
          </div>
        </div>
      `;

      // 2. Respuesta rápida de voz o texto corto para el bot
      let resumenVoz = "";
      if (estado.includes("OPERATIVO") || estado.includes("BUEN")) {
        resumenVoz = `El ${maqNombre} ${id} está operativo en ${ubicacion}.`;
      } else {
        resumenVoz = `Atención: El ${maqNombre} ${id} reporta: ${estado}.`;
      }

      // Imprimimos la ficha técnica (HTML)
      imprimirBot(fichaHTML);
      
      // Si tienes la voz activa, que solo diga el resumen corto para no marear
      if (VOZ_ACTIVA) hablarFormal(resumenVoz);
    }

    // --- FUNCIONES GUINDA (MODAL) ---
    function abrirModalRegistro(maquina, id) {
      estadoSesion.maquinaPendiente = maquina;
      estadoSesion.idPendiente = id;
      document.getElementById('info-maquina-registro').innerText = `${maquina} - UNIDAD ${id}`;
      document.getElementById('modal-registro').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('modal-registro').style.display = 'none';
    }

    async function confirmarRegistro() {
      const nombre = document.getElementById('nombre-alumno').value;
      const boleta = document.getElementById('boleta-alumno').value;
      const grupo = document.getElementById('grupo-alumno').value;

      if (!nombre || !boleta || !grupo) {
          alert("Por favor, llena todos los campos (Nombre, Boleta y Grupo).");
          return;
      }
      cerrarModal();
      imprimirBot(`Procesando registro para ${nombre} del grupo ${grupo}...`);

      const datos = {
          nombre: nombre,
          boleta: boleta,
          grupo: grupo,
          equipo: estadoSesion.maquinaPendiente,
          id: estadoSesion.idPendiente,
          accion: "INICIO DE OPERACIÓN"
      };

      try {
          await fetch(URL_GUINDA_GATEWAY, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(datos)
          });
          imprimirBot(`✅ **REGISTRO EXITOSO.** Operador autorizado. Bitácora actualizada.`);
          document.getElementById('nombre-alumno').value = "";
          document.getElementById('boleta-alumno').value = "";
          document.getElementById('grupo-alumno').value = "";
      } catch (e) {
          imprimirBot("❌ Error al registrar en la bitácora.");
      }
    }

    // --- UTILIDADES ---
    function imprimirBot(texto) {
      const chat = document.getElementById('chat-messages');
      chat.innerHTML += `<div class="msg-bot">${texto}</div>`;
      chat.scrollTop = chat.scrollHeight;
      if (VOZ_ACTIVA) hablarFormal(texto);
    }

async function cargarDatosSheet(gid) {
  
  const url = `https://docs.google.com/spreadsheets/d/e/2PACX-1vRUrhKITYUYWL4moZTLQuM2ggb906ulR0-jQwOn-m_UpO1T_6VP6a9o3FhL1YO9eYNvlZtJvdJLMgad/pub?gid=${gid}&single=true&output=csv`;
  
  try {
      const res = await fetch(url);
      if (!res.ok) throw new Error("No se pudo obtener el CSV");
      const csv = await res.text();
      const rows = parseCSV(csv);
      const headers = rows[0].map(h => String(h || '').trim().toUpperCase());
      return rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, i) => obj[h] = String(r[i] ?? '').trim());
        return obj;
      });
  } catch (err) {
      console.error("Error cargando GID " + gid, err);
      throw err;
  }
}

    function parseCSV(text) {
      const rows = []; let row = []; let cur = ''; let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') { inQuotes = !inQuotes; continue; }
        if (c === ',' && !inQuotes) { row.push(cur); cur = ''; continue; }
        if ((c === '\n' || c === '\r') && !inQuotes) {
          row.push(cur); cur = ''; if (row.length > 1 || row[0] !== '') rows.push(row);
          row = []; continue;
        }
        cur += c;
      }
      row.push(cur); if (row.length > 1 || row[0] !== '') rows.push(row);
      return rows;
    }

    function toggleVoz() {
      VOZ_ACTIVA = !VOZ_ACTIVA;
      document.getElementById("btnVoz").textContent = VOZ_ACTIVA ? "🔊 ON" : "🔊 OFF";
    }

    function hablarFormal(texto) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto.replace(/\*/g, ''));
      u.lang = "es-MX"; u.rate = 0.9; u.pitch = 1;
      window.speechSynthesis.speak(u);
    }

    function dictarPregunta() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert('Navegador no soportado');
      const rec = new SpeechRecognition();
      rec.lang = 'es-MX';
      rec.onresult = (e) => {
        document.getElementById('pregunta').value = e.results[0][0].transcript;
        hacerPregunta();
      };
      rec.start();
    }
  </script>
</body>
</html>
