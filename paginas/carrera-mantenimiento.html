<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento Industrial - CECyT 7</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #640328;
      color: white;
      min-height: 100vh;
    }

    .barra-superior {
      position: fixed;
      top: 0;
      width: 100%;
      height: 12vh;
      min-height: 80px;
      background-color: white;
      border-bottom: 4px solid #640328;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 30px;
      z-index: 1000;
    }

    .logo {
      height: 80px;
    }

    .contenedor {
      margin-top: 140px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 32px;
    }

    .btn-volver {
      padding: 10px 20px;
      background-color: white;
      color: #640328;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 20px;
      transition: all 0.3s;
    }

    .btn-volver:hover {
      background-color: #f0f0f0;
    }

    .consulta {
      background-color: white;
      color: #640328;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    .consulta p {
      margin-bottom: 15px;
      font-weight: bold;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .consulta input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .consulta button {
      padding: 12px 30px;
      font-size: 16px;
      background-color: #640328;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }

    .consulta button:hover {
      background-color: #4a0220;
    }

    .consulta button:active {
      transform: scale(0.98);
    }

    .respuesta {
      background-color: #f2f2f2;
      color: #333;
      padding: 15px;
      border-radius: 6px;
      min-height: 40px;
      border-left: 4px solid #640328;
    }

    .respuesta.error {
      background-color: #ffebee;
      border-left-color: #c62828;
      color: #c62828;
    }

    .respuesta.exito {
      background-color: #e8f5e9;
      border-left-color: #2e7d32;
      color: #2e7d32;
    }

    .cargando {
      display: none;
      text-align: center;
      margin: 20px 0;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #640328;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .resultados {
      margin-top: 20px;
      max-height: 500px;
      overflow-y: auto;
    }

    .resultado-item {
      background-color: #f9f9f9;
      color: #333;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border-left: 3px solid #640328;
    }

    .resultado-item strong {
      color: #640328;
    }
  </style>
</head>
<body>

  <!-- Barra superior -->
  <div class="barra-superior">
    <img src="../img/logo_ipn.png" class="logo">
    <img src="../img/logo_cecyt7.png" class="logo">
  </div>

  <div class="contenedor">
    <button class="btn-volver" onclick="window.location.href='./carreras.html'">
      ← Volver a Carreras
    </button>

    <h1>🔧 Mantenimiento Industrial</h1>

    <div class="consulta">
      <p>Consulta información sobre la maquinaria del taller:</p>

      <div class="input-group">
        <input 
          type="text" 
          id="pregunta"
          placeholder="Ejemplo: ¿Dónde se ubican los tornos?"
          onkeypress="if(event.key === 'Enter') hacerPregunta()"
        >
        <button onclick="hacerPregunta()">🔍 Buscar</button>
      </div>

      <div class="cargando" id="cargando">
        <div class="spinner"></div>
        <p>Buscando en la base de datos...</p>
      </div>

      <div class="respuesta" id="respuesta" style="display: none;"></div>
      <div class="resultados" id="resultados"></div>
    </div>
  </div>

<script>
const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxAPNIelj_q1DAQCqQR2MVih_SYMJpME1rB_RuDL-1zpkAwsxYf72nKHxF1zmnhdgbQ/exec';

function detectarConsultaTorno(pregunta) {
  const m = pregunta.toLowerCase().match(/\btorno\s*(\d+)\b/);
  return m ? m[1] : null; // regresa "17" o null
}

async function fetchJsonRobusto(url) {
  const res = await fetch(url);
  const text = await res.text();

  if (!text) throw new Error("Respuesta vacía del servidor");

  let data;
  try { data = JSON.parse(text); }
  catch {
    throw new Error("El servidor no devolvió JSON (posible permisos). Respuesta: " + text.slice(0, 200));
  }

  if (!res.ok) throw new Error(data?.error || "Error HTTP " + res.status);
  return data;
}

async function hacerPregunta() {
  const pregunta = document.getElementById('pregunta').value.trim();
  if (!pregunta) return mostrarError('Por favor escribe una pregunta');

  mostrarCargando(true);
  ocultarRespuesta();

  try {
    const idTorno = detectarConsultaTorno(pregunta);

    let datos;
    if (idTorno) {
      // Consulta exacta por torno #
      const url = `${GOOGLE_APPS_SCRIPT_URL}?accion=buscarPorId&tipo=TORNO&id=${encodeURIComponent(idTorno)}`;
      datos = await fetchJsonRobusto(url);

      if (!datos.ok) throw new Error(datos.error || "No encontrado");
      // Mostrar bonito (puedes adaptar)
      mostrarRespuestas({
        cantidad: 1,
        resultados: [{
          coincidencia: "TORNO",
          valor: `ID ${idTorno}`,
          item: datos.data
        }]
      });
    } else {
      // Consulta general
      const url = `${GOOGLE_APPS_SCRIPT_URL}?accion=hacerConsulta&pregunta=${encodeURIComponent(pregunta)}`;
      datos = await fetchJsonRobusto(url);

      if (!datos.ok) throw new Error(datos.error || "Error en consulta");
      mostrarRespuestas(datos);
    }

  } catch (error) {
    mostrarError(`Error: ${error.message}`);
  } finally {
    mostrarCargando(false);
  }
}
</script>

</body>
</html>
