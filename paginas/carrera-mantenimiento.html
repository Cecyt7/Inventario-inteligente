<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento Industrial - CECyT 7</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background-color: #640328;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Barra superior */
    .barra-superior {
      position: fixed;
      top: 0;
      width: 100%;
      height: 80px;
      background-color: white;
      border-bottom: 4px solid #FFD700; /* Oro */
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 30px;
      z-index: 1000;
    }

    .logo { height: 60px; }

    /* Contenedor */
    .contenedor {
      margin-top: 100px;
      flex: 1;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      width: 95%;
      padding-bottom: 40px;
    }

    .btn-volver {
      padding: 10px 20px;
      background-color: white;
      color: #640328;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 { text-align: center; margin-bottom: 20px; font-size: 28px; }

    /* Chat Estilo */
    .chat-container {
      background-color: #f9f9f9;
      border-radius: 15px;
      height: 400px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      overflow: hidden;
      margin-bottom: 15px;
    }

    #chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-user {
      align-self: flex-end;
      background-color: #640328;
      color: white;
      padding: 8px 15px;
      border-radius: 15px 15px 0 15px;
      max-width: 80%;
      font-size: 14px;
    }

    .msg-bot {
      align-self: flex-start;
      background-color: #e0e0e0;
      color: #333;
      padding: 8px 15px;
      border-radius: 15px 15px 15px 0;
      max-width: 80%;
      font-size: 14px;
      border-left: 4px solid #FFD700;
    }

    /* Entrada de datos */
    .input-group {
      display: flex;
      gap: 8px;
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    #pregunta {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 5px;
      outline: none;
      color: black;
    }

    .botones button {
      padding: 10px 15px;
      background-color: #640328;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .cargando { text-align: center; color: #FFD700; display: none; margin-top: 10px; }

    @media (max-width: 600px) {
      .barra-superior { padding: 0 10px; }
      .logo { height: 40px; }
    }
  </style>
</head>
<body>

  <div class="barra-superior">
    <img src="../img/logo_ipn.png" class="logo" alt="IPN">
    <img src="../img/logo_cecyt7.png" class="logo" alt="CECyT 7">
  </div>

  <div class="contenedor">
    <button class="btn-volver" onclick="window.location.href='./carreras.html'">← Volver</button>
    
    <h1>🔧 Inventario Inteligente</h1>

    <div class="chat-container">
      <div id="chat-messages">
        <div class="msg-bot">¡Qué onda, paps! Soy la IA del taller. ¿Qué máquina quieres consultar hoy?</div>
      </div>
    </div>

    <div class="input-group">
      <input type="text" id="pregunta" placeholder="Ej: Torno 2" onkeypress="if(event.key === 'Enter') hacerPregunta()">
      <div class="botones">
        <button onclick="hacerPregunta()">Enviar</button>
        <button id="btnVoz" onclick="toggleVoz()">🔊 OFF</button>
        <button onclick="dictarPregunta()">🎤</button>
      </div>
    </div>

    <div id="cargando" class="cargando">Buscando en la base de datos...</div>
  </div>

  <script>
    const SHEET_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRUrhKITYUYWL4moZTLQuM2ggb906ulR0-jQwOn-m_UpO1T_6VP6a9o3FhL1YO9eYNvlZtJvdJLMgad/pub';
    const MAQUINAS_GID = { 'torno': 0, 'fresadora': 1, 'mesa': 2, 'esmeril': 3, 'soldadora': 4, 'taladradora': 5, 'cepillo': 6, 'compresor': 7, 'cnc': 8 };

    let CACHE = {};
    let VOZ_ACTIVA = false;

    function detectarMaquina(pregunta) {
      const q = pregunta.toLowerCase();
      const dicc = {
        'torno': [/torn/], 'fresadora': [/fresa/], 'mesa': [/mesa/], 'esmeril': [/esmeril/],
        'soldadora': [/solda/], 'taladradora': [/taladra/], 'cepillo': [/cepillo/],
        'compresor': [/compre/], 'cnc': [/cnc/, /compu/]
      };
      for (const [key, regexs] of Object.entries(dicc)) {
        if (regexs.some(rx => rx.test(q))) return { nombre: key.toUpperCase(), key: key };
      }
      return null;
    }

    function detectarID(pregunta) {
      const m = pregunta.match(/\b(\d+)\b/);
      return m ? m[1] : null;
    }

    function parseCSV(text) {
      const rows = []; let row = []; let cur = ''; let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') { inQuotes = !inQuotes; continue; }
        if (c === ',' && !inQuotes) { row.push(cur); cur = ''; continue; }
        if ((c === '\n' || c === '\r') && !inQuotes) {
          row.push(cur); cur = ''; if (row.length > 1 || row[0] !== '') rows.push(row);
          row = []; continue;
        }
        cur += c;
      }
      row.push(cur); if (row.length > 1 || row[0] !== '') rows.push(row);
      return rows;
    }

    async function cargarDatosSheet(gid) {
      const url = `${SHEET_BASE}?gid=${gid}&single=true&output=csv`;
      const res = await fetch(url, { cache: "no-store" });
      const csv = await res.text();
      const rows = parseCSV(csv);
      const headers = rows[0].map(h => String(h || '').trim());
      return rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, i) => obj[h] = String(r[i] ?? '').trim());
        return obj;
      });
    }

    function mostrarRespuestas(datos, maqNombre, queryUsuario) {
      const chatMessages = document.getElementById('chat-messages');
      chatMessages.innerHTML += `<div class="msg-user">${queryUsuario}</div>`;

      let respuestaIA = "";
      if (!datos || datos.cantidad === 0) {
        respuestaIA = "Híjole paps, no encontré nada de eso en el inventario.";
      } else {
        const item = datos.resultados[0].item;
        // Ajusta estos nombres según tus columnas del Excel
        const id = item["IDENTIFICACION"] || "N/A";
        const estado = item["ESTADO"] || "sin reporte";
        respuestaIA = `¡Simón! El ${maqNombre} (ID: ${id}) está en estado: **${estado}**.`;
      }

      chatMessages.innerHTML += `<div class="msg-bot">${respuestaIA}</div>`;
      chatMessages.scrollTop = chatMessages.scrollHeight;
      if (VOZ_ACTIVA) hablar(respuestaIA);
    }

    async function hacerPregunta() {
      const input = document.getElementById('pregunta');
      const pregunta = input.value.trim();
      if (!pregunta) return;
      
      document.getElementById('cargando').style.display = 'block';
      try {
        const maq = detectarMaquina(pregunta);
        if (!maq) throw new Error('No detecté la máquina. Prueba con: Torno, Fresadora, etc.');
        
        if (!CACHE[maq.key]) CACHE[maq.key] = await cargarDatosSheet(MAQUINAS_GID[maq.key]);
        const data = CACHE[maq.key];
        const id = detectarID(pregunta);
        
        let resultados = [];
        if (id) {
          const row = data.find(x => String(x["IDENTIFICACION"]).trim() === id);
          if (row) resultados.push({ item: row });
        } else {
          // Búsqueda general
          resultados = data.filter(item => Object.values(item).some(v => v.toLowerCase().includes(pregunta.toLowerCase()))).map(r => ({ item: r }));
        }
        
        mostrarRespuestas({ cantidad: resultados.length, resultados: resultados }, maq.nombre, pregunta);
        input.value = "";
      } catch (e) {
        const chatMessages = document.getElementById('chat-messages');
        chatMessages.innerHTML += `<div class="msg-user">${pregunta}</div>`;
        chatMessages.innerHTML += `<div class="msg-bot" style="color:red">⚠️ ${e.message}</div>`;
      } finally {
        document.getElementById('cargando').style.display = 'none';
      }
    }

    function toggleVoz() {
      VOZ_ACTIVA = !VOZ_ACTIVA;
      document.getElementById("btnVoz").textContent = VOZ_ACTIVA ? "🔊 ON" : "🔊 OFF";
    }

    function hablar(texto) {
      if (!VOZ_ACTIVA || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = "es-MX";
      window.speechSynthesis.speak(u);
    }

    function dictarPregunta() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert('Navegador no soportado');
      const rec = new SpeechRecognition();
      rec.lang = 'es-MX';
      rec.onresult = (e) => {
        document.getElementById('pregunta').value = e.results[0][0].transcript;
        hacerPregunta();
      };
      rec.start();
    }
  </script>
</body>
</html>
